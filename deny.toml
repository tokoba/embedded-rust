[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
deny = ["GPL-2.0", "GPL-3.0", "AGPL-1.0", "AGPL-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
skip = [
  { name = "windows-sys", reason = "Windows dependencies often require different versions" },
  { name = "log", reason = "Transient dependencies sometimes require different versions" },
]

[[bans.deny]]
name = "openssl-sys"
reason = "Use rustls instead for better security and no OpenSSL dependency"

[[bans.deny]]
name = "curl"
reason = "Use reqwest instead for better Rust ecosystem integration"

[[bans.deny]]
name = "openssl"
reason = "Use rustls instead for better security and no OpenSSL dependency"

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"

[sources]
allow-git = false
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-registry = "deny"
unknown-git = "deny"
sparse-registry = "allow"
