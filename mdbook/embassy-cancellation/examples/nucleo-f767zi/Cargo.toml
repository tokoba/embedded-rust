[package]
name = "nucleo-f767zi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
static_cell = "2"

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt", "integrated-timers"] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"
embassy-stm32 = { version = "0.2", features = ["defmt", "stm32f767zi", "memory-x", "time-driver-tim2", "exti"] }

[profile.release]
debug = 2
lto = true
opt-level = "z"
codegen-units = 1
