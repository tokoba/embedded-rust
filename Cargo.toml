[workspace]
members = [
  "crates/*",
  "xtask",
  "mdbook/embassy-cancellation/examples/nucleo-f767zi",
]
exclude = ["crates/_template-*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["tokoba <tokoba@gmail.com>"]
license = "MIT"
description = "Embedded-Rust"
repository = "https://github.com/tokoba/embedded-rust.git"
readme = "README.md"
rust-version = "1.95.0"
edition = "2024"
publish = false

[workspace.dependencies]
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
] }
embassy-stm32 = { version = "0.6.0", features = [
  "defmt",
  "stm32f767zi",
  "unstable-pac",
  "time-driver-any",
  "exti",
  "single-bank",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768",
] }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "tcp",
  "dhcpv4",
  "medium-ethernet",
  "auto-icmp-echo-reply",
] }
embedded-io-async = { version = "0.7.0" }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embedded-test-linker-script = "0.1.0"
defmt = "1.1.0"
defmt-rtt = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = [
  "inline-asm",
  "critical-section-single-core",
] }
cortex-m-rt = "0.7.5"
embedded-hal = "1.0.0"
heapless = { version = "0.9.3", default-features = false }
nb = "1.1.0"
critical-section = "1.2.0"
embedded-storage = "0.3.1"
static_cell = "2.1.1"
sha2 = { version = "0.11.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
proptest = "1.11.0"

[workspace.lints.rust]
warnings = { level = "warn" }
unused = { level = "warn", priority = -1 }
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "deny" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[workspace.metadata]
project-type = "examples"

[profile.dev]
incremental = true
debug = 2

[profile.release]
debug = 2
lto = true
opt-level = 2
