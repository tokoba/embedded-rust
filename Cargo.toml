[workspace]
members = ["crates/*"]
exclude = ["crates/_template-*"]

# 現在の西暦は2025年でresolver "3" が最新版である。(rust edition 2024 では resolver "3" がデフォルト)
resolver = "3"

[workspace.package]
# 各クレートのCargo.tomlから継承できるメタ情報
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
description = "Rust Examples Workspace"
repository = "https://github.com/your/repo"
readme = "README.md"
rust-version = "1.93.0"
# 現在の西暦は2025年でRust Edition 2024が最新版である。
edition = "2024"
publish = false

[workspace.dependencies]
# よく使う依存関係をここでバージョン統一
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[workspace.dev-dependencies]

[workspace.lints.rust]
# 開発体験を損ねない範囲で厳格化。CIでは -D warnings を併用するのが実務的
warnings = { level = "warn" }
unused = { level = "warn", priority = -1 }
missing_docs = { level = "warn" }
missing_debug_implementations = { level = "deny" }

[workspace.lints.clippy]
# グループ（all/pedantic）は priority = -1 で先に適用し、個別 lint が後から上書きできるようにする
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }

[workspace.metadata]
project-type = "examples"

[profile.dev]
incremental = true
debug = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
